version: "3"

vars:
  BINARY: crushbot

tasks:
  default:
    desc: Build crushbot
    cmds:
      - go build -o {{.BINARY}} ./cmd/crushbot

  test:
    desc: Run tests
    cmds:
      - go test ./...

  vet:
    desc: go vet
    cmds:
      - go vet ./...

  tidy:
    desc: go mod tidy
    cmds:
      - go mod tidy
